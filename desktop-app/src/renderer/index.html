<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Nightcore AQP · Descargador</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="bg-layer"></div>

    <header class="topbar">
      <div>
        <div class="brand"><span class="logo">✦</span> NIGHTCORE <span class="aqp">AQP</span></div>
        <div class="subtitle">Descargador de música — local y a máxima calidad <span id="version" class="version"></span></div>
      </div>
      <button id="personalize-toggle" class="btn-ghost" title="Personalizar la apariencia">🎨 Personalizar</button>
    </header>

    <div id="personalize" class="personalize hidden">
      <div class="pz-group">
        <span class="pz-label">Tema</span>
        <div class="pz-themes" id="pz-themes">
          <button class="pz-theme" data-theme="default">Scenecore</button>
          <button class="pz-theme" data-theme="pixel">Pixel</button>
          <button class="pz-theme" data-theme="gothic">Gótico</button>
          <button class="pz-theme" data-theme="anime">Anime</button>
        </div>
      </div>
      <div class="pz-group">
        <span class="pz-label">Fondo</span>
        <label class="btn-ghost pz-file">Elegir imagen<input type="file" id="bg-file" accept="image/*" hidden></label>
        <button id="bg-clear" class="btn-ghost">Quitar</button>
        <span class="pz-label">Opacidad</span>
        <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="0.5" class="pz-range">
      </div>
    </div>

    <div id="update-bar" class="update-bar hidden">
      <span id="update-text"></span>
      <button id="update-install" class="update-btn hidden">Reiniciar y actualizar</button>
    </div>

    <main class="wrap">
      <section class="card">
        <label class="label" for="urls">Enlaces (uno por línea)</label>
        <textarea id="urls" rows="5" placeholder="https://www.youtube.com/watch?v=…&#10;https://www.tiktok.com/@…&#10;…"></textarea>

        <div class="row">
          <div class="seg" id="format">
            <button class="seg-btn active" data-format="mp3">MP3</button>
            <button class="seg-btn" data-format="mp4">MP4</button>
          </div>

          <select id="quality" class="select" title="Calidad de video (solo MP4)" disabled>
            <option value="best">Mejor calidad</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>

          <select id="cookies" class="select" title="Si YouTube pide verificación, usa las cookies de tu navegador">
            <option value="">Cookies: ninguna</option>
            <option value="chrome">Chrome</option>
            <option value="edge">Edge</option>
            <option value="firefox">Firefox</option>
            <option value="brave">Brave</option>
            <option value="opera">Opera</option>
            <option value="vivaldi">Vivaldi</option>
          </select>

          <button id="cookies-file" class="btn-ghost" title="Usar un archivo cookies.txt (lo más fiable para MP4; funciona con Chrome abierto)">📄 cookies.txt</button>

          <button id="download" class="btn-primary">⏬ Descargar</button>
        </div>

        <div class="folder">
          <span class="folder-label">Carpeta:</span>
          <code id="folder-path" title="Carpeta de destino">…</code>
          <button id="change-folder" class="btn-ghost">Cambiar</button>
          <button id="open-folder" class="btn-ghost">Abrir</button>
        </div>
      </section>

      <section class="card log-card">
        <div class="log-head">
          <span>Registro</span>
          <span id="status" class="status"></span>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
